            label: Middels synlig - Objektet er middels synlig/gjenkjennbart i flybilde
              eller annen datakilde for posisjonering. Ved fotogrammetrisk datafangst
              brukes denne koden for objekter som har lav kontrast eller er delvis
              skjult av overliggende objekter (vegetasjon, takoverbygg, bruer etc.).
