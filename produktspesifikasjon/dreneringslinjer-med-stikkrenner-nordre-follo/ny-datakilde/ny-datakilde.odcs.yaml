# Open Data Contract Standard (ODCS) v3.1.0 — generert fra datamodellen.
apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:dreneringslinjer-med-stikkrenner-nordre-follo-ny-datakilde:1.0.0
version: 1.0.0
status: active
name: Dreneringslinjer med stikkrenner Nordre Follo - Ny datakilde
schema:
- name: StikkrenneKulvert
  physicalName: stikkrennekulvert
  logicalType: object
  physicalType: table
  description: 'Stikkrenne: konstruksjoner og rør med maksimal lysåpning 1,0 meter
    under veg eller jernbane, der vann kan strømme gjennom.


    Kulvert: konstruksjoner og rør med lysåpning over 1,0 meter og maksimal 2,5 meter
    under veg eller jernbane, der vann kan strømme gjennom.'
  customProperties:
  - property: sosiObjektType
    value: StikkrenneKulvert
  - property: inheritsFrom
    value: StikkrenneKulvert-NVDB
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator av et objekt


        Merknad: Det er dataleverendørens ansvar å sørge for at den lokale identifikatoren
        er unik innenfor navnerommet. For FKB-data benyttes UUID som lokalId.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til et objekt, anbefales
        å være en http-URI


        Eksempel: http://data.geonorge.no/SentraltStedsnavnsregister/1.0


        Merknad : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og må være registrert i data.geonorge.no eller
        data.norge.no'
      required: true
    - name: versjonId
      logicalType: string
      description: identifikasjon av en spesiell versjon av et geografisk objekt (instans)
    description: unik identifikasjon av et objekt
    required: true
  - name: eksternPeker
    logicalType: string
    description: referanse til objektet i et eksternt system, som ikke er Nasjonal
      vegdatabank (NVDB).
  - name: nvdbPeker
    logicalType: string
    description: referanse til objektet i Nasjonal vegdatabank (NVDB).
  - name: datafangstdato
    logicalType: date
    description: 'dato når objektet siste gang ble registrert/observert/målt i terrenget


      Merknad: I mange tilfeller er denne forskjellig fra oppdateringsdato, da registrerte
      endringer kan bufres i en kortere eller lengre periode før disse legges inn
      i databasen.

      Ved førstegangsregistrering settes Datafangstdato lik førsteDatafangstdato.'
    required: true
  - name: verifiseringsdato
    logicalType: date
    description: 'dato når dataene er fastslått å være i samsvar med virkeligheten


      Merknad: Verifiseringsdato er identisk med ..DATO i tidligere versjoner av SOSI'
  - name: kvalitet
    logicalType: object
    properties:
    - name: datafangstmetode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/fkb/generell/5.0/datafangstmetode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Datafangstmetode
      - property: asDictionary
        value: 'true'
      description: 'metode for datafangst.

        Egenskapen beskriver datafangstmetode for grunnrisskoordinater (x,y), eller
        for både grunnriss og høyde (x,y,z) dersom det ikke er oppgitt noen verdi
        for datafangstmetodeHøyde.'
      required: true
    - name: nøyaktighet
      logicalType: integer
      description: 'standardavviket til posisjoneringa av objektet oppgitt i cm


        I de aller fleste sammenhenger benyttes en anslått eller forventet verdi for
        standardavvik, men dersom man har en beregnet verdi skal denne benyttes.


        For objekter med punktgeometri benyttes verdi for punktstandardavvik. For
        objekter med kurvegeometri benyttes standardavviket for tverravviket fra kurva.
        For objekter med overflate- eller volumgeometri er forståelsen at standardavviket
        beregnes ut fra (3D) avvikene mellom sann posisjon og nærmeste punkt på overflata.


        Merknad:

        Verdien er ment å beskrive nøyaktigheten til objektet sammenlignet med sann
        verdi. Standardavvik er i utgangspunktet et mål på det tilfeldige avviket
        og det innebærer at vi forutsetter at det systematiske avviket i liten grad
        påvirker nøyaktigheten til posisjoneringa. For fotogrammetriske data settes
        som hovedregel verdien lik kravet til standardavvik ved datafangst. Se standarden
        Geodatakvalitet for nærmere definisjon av standardavvik og hvordan dette defineres,
        beregnes og kontrolleres.'
    - name: synbarhet
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/fkb/generell/5.0/synbarhet
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Synbarhet
      - property: asDictionary
        value: 'true'
      description: beskrivelse av hvor godt objektene framgår i datagrunnlaget for
        posisjonering (f.eks. flybildene).
    - name: datafangstmetodeHøyde
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/fkb/generell/5.0/datafangstmetode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Datafangstmetode
      - property: asDictionary
        value: 'true'
      description: 'metoden brukt for høyderegistrering av posisjon.


        Det er bare nødvending å angi en verdi for egenskapen dersom datafangstmetode
        for høyde avviker fra datafangstmetode for grunnriss.'
    - name: nøyaktighetHøyde
      logicalType: integer
      description: 'standardavviket til posisjoneringa av objektet oppgitt i cm


        I de aller fleste sammenhenger benyttes en anslått eller forventet verdi for
        standardavviket, men dersom man faktisk har standardavviket til posisjoneringa
        av objektet oppgitt i cm


        I de aller fleste sammenhenger benyttes en anslått eller forventet verdi for
        standardavvik, men dersom man har en beregnet verdi skal denne benyttes.


        Merknad:

        Verdien er ment å beskrive nøyaktigheten til objektet sammenlignet med sann
        verdi. Standardavvik er i utgangspunktet et mål på det tilfeldige avviket
        og det innebærer at vi forutsetter at det systematiske avviket i liten grad
        påvirker nøyaktigheten til posisjoneringa. For fotogrammetriske data settes
        som hovedregel verdien lik kravet til standardavvik ved datafangst. Se standarden
        Geodatakvalitet for nærmere definisjon av standardavvik og hvordan dette defineres,
        beregnes og kontrolleres.'
    description: 'beskrivelse av kvaliteten på stedfestingen


      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
    required: true
  - name: medium
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/fkb/generell/5.0/medium
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Medium
    - property: asDictionary
      value: 'true'
    description: 'objektets beliggenhet i forhold til jordoverflaten


      Eksempel:

      På bro, i tunnel, inne i et bygningsmessig anlegg, etc.'
  - name: informasjon
    logicalType: string
    description: 'generell opplysning


      Merknad:

      mulighet til å legge inn utfyllende informasjon om objektet'
  - name: høydereferanse
    logicalType: string
    logicalTypeOptions:
      pattern: ^(toppUtvendig|toppInnvendig|senter|bunnInnvendig|underkantUtvendig|påBakken|fot|ukjent)$
    customProperties:
    - property: allowedValues
      value:
      - value: toppUtvendig
        label: høydereferansen er til toppen av komponenten
      - value: toppInnvendig
        label: høydereferansen er topp innvendig komponent
      - value: senter
        label: 'høydereferansen er senter innvendig


          Eksempel: Dersom en ønsker å representere volumet på rør, kan dette gjøres
          med å angi LedningHøydereferanse = senter og supplere dette med passende
          radius.'
      - value: bunnInnvendig
        label: 'høydereferansen er bunn innvendig


          Eksempel: Dette er nyttig når en skal modellere fall på avløpsrør'
      - value: underkantUtvendig
        label: høydereferansen er bunn utvendig
      - value: påBakken
        label: 'høydereferanse er på bakken


          Merknad: Mange ledninger er målt på lukket grøft'
      - value: fot
        label: naturlig å bruke for eksempel på master/mastefundamenter
      - value: ukjent
        label: brukes der det ikke er kjent hva som er benyttet som høydereferanse
    description: koordinatregistering utført på topp eller bunn av et objekt
  - name: tilknyttetLukkaDren
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ja|Nei)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ja
        label: ja
      - value: Nei
        label: nei
    description: Angir om stikkrenne er tilknytta lukka drenering. Vannet ledes inn
      i et lukket dreneringssystem.
  - name: gjennomløpForElvBekk
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ja|Nei)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ja
        label: ja
      - value: Nei
        label: nei
    description: Angir om elv/bekk renner gjennom stikkrenne/kulvert.
  - name: materialtype
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Betong|Eternitt|Naturstein|Plast|Stål|Tre)$
    customProperties:
    - property: allowedValues
      value:
      - value: Betong
        label: Betong
      - value: Eternitt
        label: Eternitt
      - value: Naturstein
        label: Naturstein
      - value: Plast
        label: Plast
      - value: Stål
        label: Stål
      - value: Tre
        label: Tre
    description: Angir materialtype.
  - name: tverrsnittsform
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ellipseform|Flatbunnet\ med\ hvelv|Rektangulær|Sirkulær)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ellipseform
        label: Ellipseform
      - value: Flatbunnet med hvelv
        label: Flatbunnet med hvelv
      - value: Rektangulær
        label: Rektangulær
      - value: Sirkulær
        label: Sirkulær
    description: Angir hvilken type tverrsnitt gjennomløpskonstruksjon har.
  - name: typeInnløp
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Kum\ over\ stikkrenne|Åpent\ i\ grøft|Åpent\ i\ grøft\ med\ støtteskjold|Åpent\
        med\ frontmur|Åpent\ med\ vingemur)$
    customProperties:
    - property: allowedValues
      value:
      - value: Kum over stikkrenne
        label: Kum over stikkrenne
      - value: Åpent i grøft
        label: Vann renner inn direkte fra åpen grøft.
      - value: Åpent i grøft med støtteskjold
        label: Åpen i grøft med støtteskjold
      - value: Åpent med frontmur
        label: Åpent med frontmur
      - value: Åpent med vingemur
        label: Åpent med vingemur
    description: Angir hvilken type innløp det er i ei stikkrenne.
  - name: typeUtløp
    logicalType: string
    logicalTypeOptions:
      pattern: ^(I\ bekk/elv|I\ skråning/terreng|Kum|Åpen\ grøft)$
    customProperties:
    - property: allowedValues
      value:
      - value: I bekk/elv
        label: Vann ledes ut i bekk/elv.
      - value: I skråning/terreng
        label: Vann ledes ut i skråning eller ut i terreng.
      - value: Kum
        label: Vann ledes til kum.
      - value: Åpen grøft
        label: Vann ledes til åpen grøft
    description: Angir hvilken type utløp det er i ei stikkrenne.
  - name: lengde
    logicalType: number
    description: Angir lengde av objektet.
  - name: indreBredde
    logicalType: number
    description: 'Angir innvendig bredde av gjennomløpskonstruksjon. Ikke aktuell
      for sirkulære tverrsnitt.

      Måleenhet: mm'
  - name: indreHøyde
    logicalType: number
    description: 'Angir innvendig høyde av gjennomløpskonstruksjon. Tar ikke hensyn
      til ev. igjenfylling i bunn av konstruksjon.

      Måleenhet: mm'
  - name: overfyllingInnløp
    logicalType: number
    description: Angir tykkelsen på overfylling ved innløp. Det vil si tykkelse fra
      topp av stikkrenne til topp dekke.
  - name: harInnløpsrist
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ja|Nei)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ja
        label: ja
      - value: Nei
        label: nei
    description: Angir om det er innløpsrist i tilknytning til objektet.
  - name: varmekabler
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Ja|Nei)$
    customProperties:
    - property: allowedValues
      value:
      - value: Ja
        label: ja
      - value: Nei
        label: nei
    description: Angir om det er varmekabler eller ikke i tilknytning til objektet.
  - name: etableringsår
    logicalType: integer
    description: Angir hvilket år objektet ble etablert på stedet.
  - name: tilleggsinformasjon
    logicalType: string
    description: Supplerende informasjon om objektet som ikke framkommer direkte av
      andre egenskapstyper.
  - name: FKB_ID
    logicalType: string
    description: Refererer til FKB-identitet. Benyttes i forbindelse med felles forvaltning
      av geometri.
  - name: eier
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Fylkeskommune|Kommune|Privat|Stat,\ Nye\ Veier|Stat,\ Statens\ vegvesen|Uavklart|Stat,\
        Bane\ NOR)$
    customProperties:
    - property: allowedValues
      value:
      - value: Fylkeskommune
        label: Fylkeskommune
      - value: Kommune
        label: Kommune
      - value: Privat
        label: Privat
      - value: Stat, Nye Veier
        label: Nye Veier
      - value: Stat, Statens vegvesen
        label: Statens vegvesen
      - value: Uavklart
        label: Verdi benyttes inntil det er avklart hvem som er eier (ingen verdi
          tolkes som at vegeier er eier).
      - value: Stat, Bane NOR
        label: Bane NOR
    description: Angir hvem som er eier av objektet.
  - name: vedlikeholdsansvarlig
    logicalType: string
    logicalTypeOptions:
      pattern: ^(Fylkeskommune|Kommune|Nye\ Veier|OPS|Privat|Statens\ vegvesen|Uavklart|Bane\
        NOR)$
    customProperties:
    - property: allowedValues
      value:
      - value: Fylkeskommune
        label: Fylkeskommune
      - value: Kommune
        label: Kommune
      - value: Nye Veier
        label: Nye Veier
      - value: OPS
        label: OPS
      - value: Privat
        label: Privat
      - value: Statens vegvesen
        label: Statens vegvesen
      - value: Uavklart
        label: Verdi benyttes inntil det er avklart hvem som er vedlikeholdsansvarlig.
      - value: Bane NOR
        label: Bane NOR
    description: Angir hvem som er ansvarlig for vedlikehold av objektet.
  - name: senterlinje
    logicalType: object
    physicalType: geometry(LineString)
    required: true
    customProperties:
    - property: geometryType
      value: LineString
