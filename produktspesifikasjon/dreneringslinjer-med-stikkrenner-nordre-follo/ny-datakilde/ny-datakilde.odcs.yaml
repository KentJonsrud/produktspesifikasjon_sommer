          for standardavviket, men dersom man faktisk har standardavviket til posisjoneringa
          av objektet oppgitt i cm


          I de aller fleste sammenhenger benyttes en anslått eller forventet verdi
          for standardavvik, men dersom man har en beregnet verdi skal denne benyttes.


          Merknad:

          Verdien er ment å beskrive nøyaktigheten til objektet sammenlignet med sann
          verdi. Standardavvik er i utgangspunktet et mål på det tilfeldige avviket
          og det innebærer at vi forutsetter at det systematiske avviket i liten grad
          påvirker nøyaktigheten til posisjoneringa. For fotogrammetriske data settes
          som hovedregel verdien lik kravet til standardavvik ved datafangst. Se standarden
          Geodatakvalitet for nærmere definisjon av standardavvik og hvordan dette
          defineres, beregnes og kontrolleres.'
    description: 'beskrivelse av kvaliteten på stedfestingen


      Merknad: Denne er identisk med ..KVALITET i tidligere versjoner av SOSI.'
    required: true
