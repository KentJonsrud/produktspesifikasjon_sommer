            label: Fullt ut synlig - Objektet er fullt ut synlig/gjenfinnbart i flybilde
              eller annen datakilde for posisjonering. Ved fotogrammetrisk registrering
              skal objekter som er fullt ut synlige registreres i tråd med angitte
              krav til nøyaktig registrering.
          - value: '1'
            label: Dårlig gjenfinnbar i terreng - Objektets posisjon er vanskelig
              å definere presist i terrenget på grunn av objektets natur eller manglende
              kontrast mot omgivelsene. Koden kan f.eks. brukes på høydekurver (eller
              andre isolinjer) eller objekter som er skjult i bakken (f.eks. innmåling
              av ledninger på lukket grøft)
        description: beskrivelse av hvor godt objektene framgår i datagrunnlaget for
          posisjonering (f.eks. flybildene).
      - name: datafangstmetodeHøyde
        logicalType: string
        logicalTypeOptions:
          pattern: ^(byg|ukj|pla|sat|gen|fot|dig|lan)$
        customProperties:
        - property: allowedValues
          value:
          - value: byg
            label: Som bygget - Posisjonen er hentet fra prosjekterte eller planlagte
              data, f.eks. fra en BIM-modell, som er verifisert som bygget ved innmålinger
          - value: ukj
            label: Ukjent - Ukjent eller uspesifisert datafangstmetode
          - value: pla
            label: Plandata - Posisjonen er hentet plandata. Posisjonen er ikke verifisert
              med innmåling.
          - value: sat
            label: Satellittmålt - Posisjonen er målt inn direkte med GNSS (for posisjoner
              målt inn med GNSS i kombinasjon med andre landmålingsmetoder skal koden
              Landmåling benyttes)
          - value: gen
            label: Generert - Posisjonen er manuelt konstruert, eller generert ved
              maskinlæring eller annen type programvare, fra punktsky fra laserskanning,
              bildematching, sonar, andre typer sensordata eller kombinasjon av flere
              typer sensordata.
          - value: fot
            label: Fotogrammetri - Posisjonen er konstruert/generert fra en fotogrammetrisk
              stereomodell
          - value: dig
            label: Digitalisert - Posisjonen er digitalisert fra ortofoto eller andre
              plane kartdata
          - value: lan
            label: Landmålt - Posisjonen er målt inn direkte med en landmålingsmetode.
              Aktuelle landmålingsmetoder kan være nivellering, vinkelmåling, avstandsmåling
              eller treghetsmåling. Kodeverdien brukes også for kombinasjoner av disse
              målemetodene eller der disse målemetodene kombineres med GNSS. Landmåling
              utføres normalt med overskytende målinger og utjevning av resultatet.
        description: 'metoden brukt for høyderegistrering av posisjon.


          Det er bare nødvending å angi en verdi for egenskapen dersom datafangstmetode
          for høyde avviker fra datafangstmetode for grunnriss.'
      - name: nøyaktighetHøyde
        logicalType: integer
        description: 'standardavviket til posisjoneringa av objektet oppgitt i cm


          I de aller fleste sammenhenger benyttes en anslått eller forventet verdi
          for standardavviket, men dersom man faktisk har standardavviket til posisjoneringa
          av objektet oppgitt i cm


          I de aller fleste sammenhenger benyttes en anslått eller forventet verdi
          for standardavvik, men dersom man har en beregnet verdi skal denne benyttes.


          Merknad:

