          - value: '3'
            label: Ikke synlig - Objektet er ikke synlig/gjenkjennbart i flybilde
              eller annen datakilde for posisjonering. Ved fotogrammetrisk datafangst
              brukes denne koden for objekter som er helt skjult av overliggende objekter
              (vegetasjon, takoverbygg, bruer etc.). For slike objekter settes en
              stor verdi for nøyaktighet (mer enn 3 ganger kravet)
          - value: '0'
            label: Fullt ut synlig - Objektet er fullt ut synlig/gjenfinnbart i flybilde
