          - value: gen
            label: Generert - Posisjonen er manuelt konstruert, eller generert ved
              maskinlæring eller annen type programvare, fra punktsky fra laserskanning,
              bildematching, sonar, andre typer sensordata eller kombinasjon av flere
              typer sensordata.
          - value: fot
            label: Fotogrammetri - Posisjonen er konstruert/generert fra en fotogrammetrisk
              stereomodell
          - value: dig
            label: Digitalisert - Posisjonen er digitalisert fra ortofoto eller andre
              plane kartdata
          - value: lan
            label: Landmålt - Posisjonen er målt inn direkte med en landmålingsmetode.
              Aktuelle landmålingsmetoder kan være nivellering, vinkelmåling, avstandsmåling
              eller treghetsmåling. Kodeverdien brukes også for kombinasjoner av disse
              målemetodene eller der disse målemetodene kombineres med GNSS. Landmåling
              utføres normalt med overskytende målinger og utjevning av resultatet.
        description: 'metode for datafangst.

          Egenskapen beskriver datafangstmetode for grunnrisskoordinater (x,y), eller
          for både grunnriss og høyde (x,y,z) dersom det ikke er oppgitt noen verdi
          for datafangstmetodeHøyde.'
        required: true
      - name: nøyaktighet
        logicalType: integer
        description: 'standardavviket til posisjoneringa av objektet oppgitt i cm


          I de aller fleste sammenhenger benyttes en anslått eller forventet verdi
          for standardavvik, men dersom man har en beregnet verdi skal denne benyttes.


          For objekter med punktgeometri benyttes verdi for punktstandardavvik. For
          objekter med kurvegeometri benyttes standardavviket for tverravviket fra
          kurva. For objekter med overflate- eller volumgeometri er forståelsen at
          standardavviket beregnes ut fra (3D) avvikene mellom sann posisjon og nærmeste
          punkt på overflata.


          Merknad:

          Verdien er ment å beskrive nøyaktigheten til objektet sammenlignet med sann
          verdi. Standardavvik er i utgangspunktet et mål på det tilfeldige avviket
          og det innebærer at vi forutsetter at det systematiske avviket i liten grad
          påvirker nøyaktigheten til posisjoneringa. For fotogrammetriske data settes
          som hovedregel verdien lik kravet til standardavvik ved datafangst. Se standarden
          Geodatakvalitet for nærmere definisjon av standardavvik og hvordan dette
          defineres, beregnes og kontrolleres.'
      - name: synbarhet
        logicalType: string
        logicalTypeOptions:
          pattern: ^(2|3|0|1)$
        customProperties:
        - property: allowedValues
          value:
