description:
  usage: ingen
  limitations: Åpne data. Lisens. Ugradert
  purpose: 'Hensikten med jordkartlegging er å dokumentere og stedfeste jordas egenskaper.
    Temakart fra det nasjonale jordkartleggingsprogrammet gir grunnlag for kunnskapsbaserte
    beslutninger innen agronomi og arealplanlegging, jordbrukets klimatilpasning samt
    risikovurderinger knyttet til miljøbelastninger innen jordbruket. NIBIO har det
    nasjonale ansvaret for jordkartlegginga.


    Jordsmonndataene gir en god og detaljert oversikt over jordressursene i Norge.
    Jordsmonndata utgjør et objektivt kunnskapsgrunnlag for beslutninger om bruk av
    jordressursen.'
