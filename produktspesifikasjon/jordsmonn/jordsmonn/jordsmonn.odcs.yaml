schema:
- name: JordsmonnGrense
  physicalName: jordsmonngrense
  logicalType: object
  physicalType: table
  description: 'grensen for jordsmonnflata

    -- Definition --

    the boundary of an expanse of soil'
  customProperties:
  - property: sosiObjektType
    value: JordsmonnGrense
  properties:
  - name: grense
    logicalType: object
    physicalType: geometry(LineString)
    required: true
    customProperties:
    - property: geometryType
      value: LineString
- name: Jordsmonn
  physicalName: jordsmonn
  logicalType: object
  physicalType: table
  description: 'geografisk område med tilnærmet enhetlige egenskaper i jordsmonnet

    -- Definition --

    geographic area with approximately uniform soil characteristics'
  customProperties:
  - property: sosiObjektType
    value: Jordsmonn
  - property: inheritsFrom
    value: Jordsmonn_Fellesegenskaper
  - property: associations
    value:
    - role: avgrensesAvJordsmonngrense
      target: JordsmonnGrense
      cardinality: 0..*
  properties:
  - name: identifikasjon
    logicalType: object
    properties:
    - name: lokalId
      logicalType: string
      description: 'lokal identifikator av et objekt

        Merknad: Det er dataleverendørens ansvar å sørge for at den lokale identifikatoren
        er unik innenfor navnerommet.'
      required: true
    - name: navnerom
      logicalType: string
      description: 'navnerom som unikt identifiserer datakilden til et objekt, anbefales
        å være en http-URI

        Eksempel: http://data.geonorge.no/SentraltStedsnavnsregister/1.0

        Merknad : Verdien for nanverom vil eies av den dataprodusent som har ansvar
        for de unike identifikatorene og må være registrert i data.geonorge.no eller
        data.norge.no'
      required: true
    description: unik identifikasjon av et objekt
    required: true
  - name: kopidata
    logicalType: object
    properties:
    - name: områdeId
      logicalType: integer
      description: 'identifikasjon av område som dataene dekker

        Merknad: Kan angis med kommunenummer eller fylkesnummer. Disse bør spesifiseres
        nærmere.'
      required: true
    - name: originalDatavert
      logicalType: string
      description: ansvarlig etat for forvaltning av data
      required: true
    - name: kopidato
      logicalType: timestamp
      description: 'dato når objektet ble kopiert fra originaldatasettet


        Merknad:

        Er en del av egenskapen Kopidata. Brukes i de tilfeller hvor en kopidatabase
        brukes til distribusjon.

        Å kopiere et datasett til en kopidatabase skal ikke føre til at Oppdateringsdato
        blir endret.

        Eventuell redigering av data i et kopidatasett medfører ny Oppdateringsdato,
        Datafangstdato og/eller Verifiseringsdato.'
      required: true
    description: 'angivelse av at objektet er hentet fra et kopidatasett og ikke fra
      originaldatasettet


      Merknad: Inneholder informasjon om når kopidatasettet ble kopiert fra originaldatasettet
      og hvem som er originaldataansvarlig'
    required: true
  - name: kvalitet
    logicalType: object
    properties:
    - name: målemetode
      logicalType: string
      authoritativeDefinitions:
      - url: https://register.geonorge.no/sosi-kodelister/generelle-konsepter/4.5/m%C3%A5lemetodekode
        type: businessDefinition
      customProperties:
      - property: sosiCodeList
        value: Målemetode
      - property: asDictionary
        value: 'true'
      description: metode for måling i grunnriss (x,y), og høyde (z) når metoden er
        den samme som ved måling i grunnriss
      required: true
    description: Beskrivelse av kvaliteten på stedfestingen.
  - name: verifiseringsdato
    logicalType: timestamp
    description: 'dato når dataene er fastslått å være i samsvar med virkeligheten

      Merknad: Verifiseringsdato er identisk med ..DATO i tidligere versjoner av SOSI'
  - name: område
    logicalType: object
    physicalType: geometry(Surface)
    required: true
    customProperties:
    - property: geometryType
      value: Surface
  - name: dominerendeTeksturOverflatesjikt
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/jordsmonn/dominerendeteksturoverflatesjikt
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: DominerendeTeksturOverflatesjikt
    - property: asDictionary
      value: 'true'
    description: 'Viser arealets dominerende tekstur (og grusinnhold) i overflatesjikt
      registrert under jordkartlegging i felt.

      -- Definition --

      category for the dominant texture in the surface layer recorded during fieldwork.'
    required: true
  - name: forstyrrelser
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/jordsmonn/forstyrrelser
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
