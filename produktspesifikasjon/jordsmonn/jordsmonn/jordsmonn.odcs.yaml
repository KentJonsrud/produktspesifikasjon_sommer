      -- Definition --

      inclination class for the soil figure'
  - name: jordsmonnklassifikasjon
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/jordsmonn/jordsmonnklassifikasjon
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Jordsmonnklassifikasjon
    - property: asDictionary
      value: 'true'
    description: 'Viser hvilken jordgruppe som dominerer på arealet

      -- Definition --

      Shows which soiltype which is dominating the area.'
    required: true
  - name: kartleggingsmetodikk
    logicalType: string
    authoritativeDefinitions:
    - url: https://register.geonorge.no/sosi-kodelister/jordsmonn/kartleggingsmetodikk
      type: businessDefinition
    customProperties:
    - property: sosiCodeList
      value: Kartleggingsmetodikk
    - property: asDictionary
      value: 'true'
    description: 'Viser hvilken opprinnelig kartleggingsmetodikk som er brukt under
