# pygeoapi-konfigurasjon — generert fra datamodellen og metadata i Geonorge.
# Verdier merket "<REPLACE_ME>" må fylles inn før tjenesten kan startes.
server:
  bind:
    host: 0.0.0.0
    port: 5000
  cors: false
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5000}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  languages:
  - nb-NO
  pretty_print: true
  admin: ${PYGEOAPI_SERVER_ADMIN:-false}
  limits:
    default_items: 20
    max_items: 100
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap
      contributors</a>'
logging:
  level: ERROR
metadata:
  identification:
    title: Jordsmonn
    description: "NIBIO kartlegger jordsmonnet på fulldyrka og overflatedyrka jord\
      \ basert på standardisert internasjonal metodikk og en fornorsket utgave av\
      \ et internasjonalt klassifikasjonssystem. Arealer med like jordegenskaper avgrenses\
      \ mot arealer med andre jordegenskaper. \n\nDatasettet inneholder en beskrivelse\
      \ av seks temakart som har opphav i jorddata fra kartleggingen, samt informasjon\
      \ om helling, stein og blokkinnhold, tilleggsinformasjon, kartleggingsmetodikk\
      \ og kartleggingsår."
    keywords:
    - Jordsmonn
    - Jordsmonnkartlegging
    - Jordegenskaper
    - Jordsmonnklassifikasjon
    - Miljøtiltak
    - Arealplanlegging
    - Jordbruk
    - Agronomi
    - Organisk materiale
    - Naturlige dreneringsforhold
    - Begrensende jordegenskap
    - Dominerende tekstur i overflatesjikt
    - Helling
    - Stein- og blokkinnhold
    - Kartleggingsmetodikk
    - Arealdekke
    - Landbruk
    - Landskap
    - Geologi
    keywords_type: theme
    terms_of_service: Åpne data
    url: https://kartkatalog.geonorge.no/metadata/0b960bb3-d9af-499e-a204-72833a4bcaaa
  license:
    name: Norsk lisens for offentlige data (NLOD) 2.0
    url: https://data.norge.no/nlod/no/2.0
  provider:
    name: Norsk institutt for bioøkonomi
    url: "<REPLACE_ME>"
  contact:
    name: Norsk institutt for bioøkonomi
    email: gisdrift@nibio.no
    url: "<REPLACE_ME>"
