      -- UnitOfMeasure --'
  - name: conspicuousGroundCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from on the ground.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
