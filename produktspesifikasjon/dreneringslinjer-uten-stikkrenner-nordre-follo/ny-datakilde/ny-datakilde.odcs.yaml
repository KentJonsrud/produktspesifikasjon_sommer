      -- UnitOfMeasure --

      metre'
  - name: horizontalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The distance available to pass a load that extends laterally beyond the wheels
      of a vehicle.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: loadClassType1
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The dynamic live load weight-bearing capacity of a bridge or bridge span for
      one-way, wheeled vehicle traffic in MLC units.

      -- Description --

      Military load classification values are calculated in part from the size, cross-sectional
      shape, and material of the stringers under the bridge span; they are similar
      to, but not the same as, short tons. See STANAGs 2021 and 2253 for the method
      of calculation.

      -- UnitOfMeasure --

      militaryLoadClass'
  - name: loadClassType2
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The dynamic live load weight-bearing capacity of a bridge or bridge span for
      two-way, wheeled vehicle traffic in MLC units.

      -- Description --

      Military load classification values are calculated in part from the size, cross-sectional
      shape, and material of the stringers under the bridge span; they are similar
      to, but not the same as, short tons. See STANAGs 2021 and 2253 for the method
      of calculation.

      -- UnitOfMeasure --

      militaryLoadClass'
  - name: loadClassType3
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The dynamic live load weight-bearing capacity of a bridge or bridge span for
      one-way, tracked vehicle traffic in MLC units.

      -- Description --

      Military load classification values are calculated in part from the size, cross-sectional
      shape, and material of the stringers under the bridge span; they are similar
