      of calculation.

      -- UnitOfMeasure --

      militaryLoadClass'
  - name: maximumVerticalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The greatest distance between the travelled way and any obstruction vertically
