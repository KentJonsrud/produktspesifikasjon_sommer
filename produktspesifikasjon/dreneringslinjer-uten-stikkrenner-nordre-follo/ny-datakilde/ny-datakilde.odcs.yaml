    description: '-- Definition --

      The angular distance in the horizontal plane measured from true north (0 degrees)
      clockwise to the path on the feature (0-180 degrees) where passage was intended.

      -- Description --

      The path of intended passage may go across or over the feature (ex. a bridge)
      or through it (ex. a tunnel).

      -- UnitOfMeasure --

      arcDegree'
  - name: bridgeInfoReliability
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The reliability of information regarding bridge military load classification
      and related characteristics.

      -- Description --

      -- UnitOfMeasure --'
  - name: controllingAuthorityIdent
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The recognized authority responsible for establishing and maintaining the administrative
      affairs of all matters relating to a particular field or subject.

      -- Description --

      -- UnitOfMeasure --'
  - name: bridgeOpeningType
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The type of structure or mechanism by which a bridge or bridge span is moved
      to allow passage of a vessel.

      -- Description --

      -- UnitOfMeasure --'
  - name: bridgeReferenceNumber
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The unique identifier of a bridge in accordance with the provisions of terrain
      analysis databases (for example: PTADB or TTADB).

      -- Description --

      The identifier is assigned consecutively (for example: within a map sheet or
      within a local area of interest) and begins with the northwest grid square of
      the UTM reference system and proceeds from left to right to the east edge of
      the sheet or area, continuing consecutively in the same way starting back at
      the west edge of the next line of UTM grid squares below those previously completed.
      The resulting identifiers are used to index an associated Bridge Information
      Table.

      -- UnitOfMeasure --'
  - name: bridgeStructureType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The type(s) of structural design of a bridge, bridge span, or bridge superstructure.

      -- Description --

      -- UnitOfMeasure --'
  - name: bypassCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The ease or ability to circumvent a destroyed section of bridge, tunnel or pass
      within a distance of two kilometres from the feature.

      -- Description --

      Bypass condition will not consider other bridges in bypass determination.

      -- UnitOfMeasure --'
  - name: colourPattern
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The colour pattern(s) of an aid to navigation (for example: a buoy, a beacon,
      and/or a navigation light) or other feature of importance to maritime navigation.

      -- Description --

      The Attribute: ''Navigation Mark Colour'' may be used to specify the colours
      in the order in which they appear in the pattern.

      -- UnitOfMeasure --'
  - name: conspicuousAirCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from the air.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: conspicuousGroundCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from on the ground.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: conspicuousSeaCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from the sea.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: controllingAuthority
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The controlling authority responsible for a facility or site.

      -- Description --

      Controlling authorities may be distinguished by organizational level (for example:
      national, sub-national, or military district) and/or type (for example: private
      or public).

      -- UnitOfMeasure --'
  - name: deckCount
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The number of vertically stacked decks, one over another, in a transportation
      structure (for example: a bridge or a tunnel).

      -- Description --

      -- UnitOfMeasure --

      unitless'
  - name: elevationMsl
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical distance of a point or a level, on or affixed to the surface of
      the Earth, measured from Mean Sea Level (MSL).

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: facilityOperationalStatus
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The status of operation of a man-made structure, as a whole.

      -- Description --

      Includes actual operations, operational capability, and planned or proposed
      man-made structures.

      -- UnitOfMeasure --'
  - name: heightAboveSurfaceLevel
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical distance measured from the lowest point of the base of the feature
      at ground or water level (downhill/downstream side) to the tallest point of
      the feature.

      -- Description --

      For non-inland water bodies, the water level is usually understood to be Mean
      Sea Level (MSL). Note that the feature may be supported above the surface by
      another feature (for example: a tower supported by a building) and as a consequence
      the value of the Height Above Surface Level is different (larger) than the base-to-top
      height of the feature (for example: supported tower) itself.

      -- UnitOfMeasure --

      metre'
  - name: highestElevation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The elevation from a specified vertical datum to the highest point on a feature.

      -- Description --

      In the case of multiple features that may be stacked on each other (for example:
      a railway on a bridge, a superstructure on a building, or an aerial on a tower)
      the highest elevation is that of the entire feature stack. For example, the
      highest elevation of a church is that of its steeple and not that of the roof
      of the church itself. The church itself may have a height above surface level
      that excludes the additional height of the steeple superstructure located on
      the church roof.

      -- UnitOfMeasure --

      metre'
  - name: horizontalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The distance available to pass a load that extends laterally beyond the wheels
      of a vehicle.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: loadClassType1
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The dynamic live load weight-bearing capacity of a bridge or bridge span for
      one-way, wheeled vehicle traffic in MLC units.

      -- Description --

      Military load classification values are calculated in part from the size, cross-sectional
      shape, and material of the stringers under the bridge span; they are similar
      to, but not the same as, short tons. See STANAGs 2021 and 2253 for the method
      of calculation.

      -- UnitOfMeasure --

      militaryLoadClass'
  - name: loadClassType2
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The dynamic live load weight-bearing capacity of a bridge or bridge span for
      two-way, wheeled vehicle traffic in MLC units.

      -- Description --

      Military load classification values are calculated in part from the size, cross-sectional
      shape, and material of the stringers under the bridge span; they are similar
      to, but not the same as, short tons. See STANAGs 2021 and 2253 for the method
      of calculation.

      -- UnitOfMeasure --

      militaryLoadClass'
  - name: loadClassType3
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The dynamic live load weight-bearing capacity of a bridge or bridge span for
      one-way, tracked vehicle traffic in MLC units.

      -- Description --

      Military load classification values are calculated in part from the size, cross-sectional
      shape, and material of the stringers under the bridge span; they are similar
      to, but not the same as, short tons. See STANAGs 2021 and 2253 for the method
      of calculation.

      -- UnitOfMeasure --

      militaryLoadClass'
  - name: loadClassType4
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The dynamic live load weight-bearing capacity of a bridge or bridge span for
      two-way, tracked vehicle traffic in MLC units.

      -- Description --

      Military load classification values are calculated in part from the size, cross-sectional
      shape, and material of the stringers under the bridge span; they are similar
      to, but not the same as, short tons. See STANAGs 2021 and 2253 for the method
      of calculation.

      -- UnitOfMeasure --

      militaryLoadClass'
  - name: maritimeNavigationMarked
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is significant to maritime safety of navigation
      and is marked (for example: by a light or beacon) by a maritime-specific navigational
      aid.

      -- Description --

      Mariners may also use other prominent features (for example: rotating aeronautical
      beacons or lighted structures) for informal navigational purposes.

      -- UnitOfMeasure --'
  - name: maximumVerticalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The greatest distance between the travelled way and any obstruction vertically
      above it.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: militaryBridgeInformation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      Information describing a bridge, typically one that is subject to preplanned
      military interdiction.

      -- Description --

      -- UnitOfMeasure --'
  - name: mobileBridgeSpan
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a bridge span moves in some manner to allow passage underneath.

      -- Description --

      -- UnitOfMeasure --'
  - name: navigationMarkColour
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The colour(s) of a International Association of Lighthouse Authorities (IALA)
      navigation mark.

      -- Description --

      When the navigation mark is patterned, the Attribute: ''Colour Pattern'' may
      be used to identify the pattern and a corresponding list of colours specified.

      -- UnitOfMeasure --'
  - name: overheadClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The least distance between the travelled way and any obstruction vertically
      above it.

      -- Description --

      Reference STANAG 2253.

      -- UnitOfMeasure --

      metre'
  - name: permanent
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is permanent.

      -- Description --

      Temporary features last, or are meant to last, for a limited time only.

      -- UnitOfMeasure --'
  - name: physicalCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The physical condition of a man-made structure, as a whole, including the inside
      and/or outside of the structure and any contained and/or associated equipment.

      -- Description --

      The physical condition applies to any phase of the life cycle of a man-made
      structure from construction to destruction. Examples of man-made structures
      include roads, canals, buildings, towers, aerodromes and facilities.

      -- UnitOfMeasure --'
  - name: radarSignificance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The predominant exposed surface material, categorized by its significance to
      radar-based sensors.

      -- Description --

      -- UnitOfMeasure --'
  - name: restrictHorizClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that horizontal clearance for vehicles on a land transportation
      route is restricted.

      -- Description --

      Horizontal clearance affects the maximum width of loads that extend laterally
      beyond the wheels of a vehicle.

      -- UnitOfMeasure --'
  - name: restrictOverheadClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that there is an overhead obstruction located less than 4.3 metres
      above a land transportation route.

      -- Description --

      Vertical clearance affects the maximum height of vehicle loads. (Reference STANAG
      2253)

      -- UnitOfMeasure --'
  - name: roofed
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is covered by a roof.

      -- Description --

      The roof may be supported by spaced pillars with intervening openings or the
      sides may be completely closed (for example: by walls or windows) and thus afford
      substantial protection from the weather.

      -- UnitOfMeasure --'
  - name: spanCount
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The number of spans in a bridge.

      -- Description --

      -- UnitOfMeasure --'
  - name: underbridgeClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      Clearance below bridge, measured from the lowest surface level to the base of
      the lower of either a cross beam or the lowest bridge deck.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: verticalClearanceSafe
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The safe vertical clearance of an object measured from the horizontal plane
      toward the object overhead.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: waterbodyOverheadObstruct
    logicalType: string
    description: '-- Definition --

      An indication that an object is an overhead obstruction over a navigable waterbody.

      -- Description --

      -- UnitOfMeasure --'
- name: Tunnel
  physicalName: tunnel
  logicalType: object
  physicalType: table
  description: '-- Definition --

    An underground passage that is open at both ends and usually contains a land transportation
    route (for example: a road and/or a railway).

    -- Description --

    Commonly used to pass through a hill or mountain, or under a river or road. May
    also provide underground passage in a mine.'
  customProperties:
  - property: sosiObjektType
    value: Tunnel
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: angleOfIntendedPassage
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The angular distance in the horizontal plane measured from true north (0 degrees)
      clockwise to the path on the feature (0-180 degrees) where passage was intended.

      -- Description --

      The path of intended passage may go across or over the feature (ex. a bridge)
      or through it (ex. a tunnel).

      -- UnitOfMeasure --

      arcDegree'
  - name: bypassCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The ease or ability to circumvent a destroyed section of bridge, tunnel or pass
      within a distance of two kilometres from the feature.

      -- Description --

      Bypass condition will not consider other bridges in bypass determination.

      -- UnitOfMeasure --'
  - name: controllingAuthority
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The controlling authority responsible for a facility or site.

      -- Description --

      Controlling authorities may be distinguished by organizational level (for example:
      national, sub-national, or military district) and/or type (for example: private
      or public).

      -- UnitOfMeasure --'
  - name: controllingAuthorityIdent
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The recognized authority responsible for establishing and maintaining the administrative
      affairs of all matters relating to a particular field or subject.

      -- Description --

      -- UnitOfMeasure --'
  - name: crossSectionalProfile
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The cross-sectional profile of an opening (for example: a tunnel or the space
      under a bridge span).

      -- Description --

      -- UnitOfMeasure --'
  - name: deckCount
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The number of vertically stacked decks, one over another, in a transportation
      structure (for example: a bridge or a tunnel).

      -- Description --

      -- UnitOfMeasure --

      unitless'
  - name: deepDepthBelowSurfLevel
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The distance measured from ground or water level (uphill/upstream side of the
      feature) to the deepest point of the feature.

      -- Description --

      May be used to measure the depth of an inland waterbody (for example: a lake),
      the depth of a terrain surface depression or excavation (for example: a crevice
      or trench), the distance to the deepest point of a drilled feature (for example:
      a water well or borehole) or the distance to the deepest point of a feature
      located entirely underground (for example: a cave chamber). In the case of a
      feature located below a waterbody (for example: a non-water well) the reference
      surface is the waterbody bottom, rather than the waterbody surface.

      -- UnitOfMeasure --

      metre'
  - name: facilityOperationalStatus
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The status of operation of a man-made structure, as a whole.

      -- Description --

      Includes actual operations, operational capability, and planned or proposed
      man-made structures.

      -- UnitOfMeasure --'
  - name: hazardShelterIntendedUse
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The intended use(s) of a designated hazard protection shelter based on the kind
      of emergency.

      -- Description --

      Hazard shelters may be located inside buildings or other structures. Shelters
      may be equipped with disaster supplies and equipment such as food and cots.

      -- UnitOfMeasure --'
  - name: heightAboveSurfaceLevel
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical distance measured from the lowest point of the base of the feature
      at ground or water level (downhill/downstream side) to the tallest point of
      the feature.

      -- Description --

      For non-inland water bodies, the water level is usually understood to be Mean
      Sea Level (MSL). Note that the feature may be supported above the surface by
      another feature (for example: a tower supported by a building) and as a consequence
      the value of the Height Above Surface Level is different (larger) than the base-to-top
      height of the feature (for example: supported tower) itself.

      -- UnitOfMeasure --

      metre'
  - name: horizontalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The distance available to pass a load that extends laterally beyond the wheels
      of a vehicle.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: leastDepthBelowSurfLevel
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The distance measured from ground or water level (uphill/upstream side of the
      feature) to the highest point of a feature located completely underground.

      -- Description --

      For example, in the case of an underground dwelling the least depth below surface
      level would be measured to its ceiling. The least depth below surface level
      may be located at ground or water level and therefore have a value of zero (for
      example: an opencast extraction mine, a terrain depression or a lake). For depths
      defined with respect to a time-varying water level, consideration should be
      given to the use of Attribute: ''Hydrographic Depth''.

      -- UnitOfMeasure --

      metre'
  - name: manMade
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is man-made.

      -- Description --

      -- UnitOfMeasure --'
  - name: maximumVerticalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The greatest distance between the travelled way and any obstruction vertically
      above it.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: monitored
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is actively monitored.

      -- Description --

      For example, attended or watched over by personnel.

      -- UnitOfMeasure --'
  - name: overheadClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The least distance between the travelled way and any obstruction vertically
      above it.

      -- Description --

      Reference STANAG 2253.

      -- UnitOfMeasure --

      metre'
  - name: pedestrianTraversable
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is traversable on foot.

      -- Description --

      -- UnitOfMeasure --'
  - name: permanent
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is permanent.

      -- Description --

      Temporary features last, or are meant to last, for a limited time only.

      -- UnitOfMeasure --'
  - name: physicalCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The physical condition of a man-made structure, as a whole, including the inside
      and/or outside of the structure and any contained and/or associated equipment.

      -- Description --

      The physical condition applies to any phase of the life cycle of a man-made
      structure from construction to destruction. Examples of man-made structures
      include roads, canals, buildings, towers, aerodromes and facilities.

      -- UnitOfMeasure --'
  - name: restrictHorizClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that horizontal clearance for vehicles on a land transportation
      route is restricted.

      -- Description --

      Horizontal clearance affects the maximum width of loads that extend laterally
      beyond the wheels of a vehicle.

      -- UnitOfMeasure --'
  - name: routeTotalUsableWidth
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The total usable width of the travelled way of a route.

      -- Description --

      Includes pavements and shoulders.

      -- UnitOfMeasure --

      metre'
  - name: safeHorizontalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      Minimum safe horizontal distance between adjacent structures on either side
      of a navigable channel.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: structMatType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The primary type(s) of material composing a feature, exclusive of the surface.

      -- Description --

      The basis for ''primary'' may be, for example, compositional dominance or structural
      organization.

      -- UnitOfMeasure --'
  - name: verticalRelativeLocation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The relationship between the feature and the underlying ground (terrain) or
      waterbody bottom.

      -- Description --

      -- UnitOfMeasure --'
- name: TransRouteProtectStruct
  physicalName: transrouteprotectstruct
  logicalType: object
  physicalType: table
  description: '-- Definition --

    A structure built over and/or along a transportation route designed to prevent
    damage to, or blockage of, the route from rock slides, snow slides and/or weather
    phenomena.

    -- Description --

    For example, a snow shed, a rock shed or a gallery. These structures are usually
    located in rugged mountainous regions.'
  customProperties:
  - property: sosiObjektType
    value: TransRouteProtectStruct
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: structMatType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The primary type(s) of material composing a feature, exclusive of the surface.

      -- Description --

      The basis for ''primary'' may be, for example, compositional dominance or structural
      organization.

      -- UnitOfMeasure --'
  - name: conspicuousAirCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from the air.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: conspicuousGroundCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from on the ground.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: controllingAuthorityIdent
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The recognized authority responsible for establishing and maintaining the administrative
      affairs of all matters relating to a particular field or subject.

      -- Description --

      -- UnitOfMeasure --'
  - name: conspicuousSeaCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from the sea.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: controllingAuthority
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The controlling authority responsible for a facility or site.

      -- Description --

      Controlling authorities may be distinguished by organizational level (for example:
      national, sub-national, or military district) and/or type (for example: private
      or public).

      -- UnitOfMeasure --'
  - name: facilityOperationalStatus
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The status of operation of a man-made structure, as a whole.

      -- Description --

      Includes actual operations, operational capability, and planned or proposed
      man-made structures.

      -- UnitOfMeasure --'
  - name: floodlit
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a structure is floodlit.

      -- Description --

      -- UnitOfMeasure --'
  - name: heightAboveSurfaceLevel
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical distance measured from the lowest point of the base of the feature
      at ground or water level (downhill/downstream side) to the tallest point of
      the feature.

      -- Description --

      For non-inland water bodies, the water level is usually understood to be Mean
      Sea Level (MSL). Note that the feature may be supported above the surface by
      another feature (for example: a tower supported by a building) and as a consequence
      the value of the Height Above Surface Level is different (larger) than the base-to-top
      height of the feature (for example: supported tower) itself.

      -- UnitOfMeasure --

      metre'
  - name: highestElevation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The elevation from a specified vertical datum to the highest point on a feature.

      -- Description --

      In the case of multiple features that may be stacked on each other (for example:
      a railway on a bridge, a superstructure on a building, or an aerial on a tower)
      the highest elevation is that of the entire feature stack. For example, the
      highest elevation of a church is that of its steeple and not that of the roof
      of the church itself. The church itself may have a height above surface level
      that excludes the additional height of the steeple superstructure located on
      the church roof.

      -- UnitOfMeasure --

      metre'
  - name: horizontalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The distance available to pass a load that extends laterally beyond the wheels
      of a vehicle.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: overheadClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The least distance between the travelled way and any obstruction vertically
      above it.

      -- Description --

      Reference STANAG 2253.

      -- UnitOfMeasure --

      metre'
  - name: permanent
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is permanent.

      -- Description --

      Temporary features last, or are meant to last, for a limited time only.

      -- UnitOfMeasure --'
  - name: physicalCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The physical condition of a man-made structure, as a whole, including the inside
      and/or outside of the structure and any contained and/or associated equipment.

      -- Description --

      The physical condition applies to any phase of the life cycle of a man-made
      structure from construction to destruction. Examples of man-made structures
      include roads, canals, buildings, towers, aerodromes and facilities.

      -- UnitOfMeasure --'
  - name: restrictHorizClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that horizontal clearance for vehicles on a land transportation
      route is restricted.

      -- Description --

      Horizontal clearance affects the maximum width of loads that extend laterally
      beyond the wheels of a vehicle.

      -- UnitOfMeasure --'
  - name: safeHorizontalClearance
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      Minimum safe horizontal distance between adjacent structures on either side
      of a navigable channel.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: transRteProtStructType
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The type of a transportation route protection structure based on its configuration
      and/or intended purpose.

      -- Description --

      -- UnitOfMeasure --'
  - name: verticalRelativeLocation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The relationship between the feature and the underlying ground (terrain) or
      waterbody bottom.

      -- Description --

      -- UnitOfMeasure --'
- name: MiscFeatureType
  physicalName: miscfeaturetype
  logicalType: object
  physicalType: table
  description: '-- Definition --

    Any feature type that falls within the scope of a feature type domain (for example:
    a feature coverage or a product specification) but is not explicitly specified
    in that domain.

    -- Description --

    May be used to allow for the flexible capture of feature instances that are unanticipated
    at the time of specifying the feature type domain. This ensures that feature instances
    deemed important for a particular mission and/or user can be captured, even though
    the most appropriate feature type is not used.'
  customProperties:
  - property: sosiObjektType
    value: MiscFeatureType
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: highestElevation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The elevation from a specified vertical datum to the highest point on a feature.

      -- Description --

      In the case of multiple features that may be stacked on each other (for example:
      a railway on a bridge, a superstructure on a building, or an aerial on a tower)
      the highest elevation is that of the entire feature stack. For example, the
      highest elevation of a church is that of its steeple and not that of the roof
      of the church itself. The church itself may have a height above surface level
      that excludes the additional height of the steeple superstructure located on
      the church roof.

      -- UnitOfMeasure --

      metre'
  - name: miscFeatureTypeDescription
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An explanation of the feature being captured such that a user of the data can
      understand what is being represented by the geometry.

      -- Description --

      When the use of MiscFeatureType is required to capture an unanticipated feature
      instance, this description will enable the end-user to understand what has been
      captured and represented by the feature geometry.

      -- UnitOfMeasure --'
  - name: heightAboveSurfaceLevel
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical distance measured from the lowest point of the base of the feature
      at ground or water level (downhill/downstream side) to the tallest point of
      the feature.

      -- Description --

      For non-inland water bodies, the water level is usually understood to be Mean
      Sea Level (MSL). Note that the feature may be supported above the surface by
      another feature (for example: a tower supported by a building) and as a consequence
      the value of the Height Above Surface Level is different (larger) than the base-to-top
      height of the feature (for example: supported tower) itself.

      -- UnitOfMeasure --

      metre'
- name: IdentifiedQualityIssue
  physicalName: identifiedqualityissue
  logicalType: object
  physicalType: table
  description: '-- Definition --

    A modeling entity where issues with data quality are identified.

    -- Description --

    For example, the identification of specific known problems in the data that could
    not be fixed within the context of the dataset delivery. This feature indicates
    to the user the potential need for caution when utilizing any data that touches,
    crosses, or exists within the identified location.'
  customProperties:
  - property: sosiObjektType
    value: IdentifiedQualityIssue
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: qualityIssueImpact
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An explanation of the assessed impact of the identified quality issue on data
      utilization.

      -- Description --


      -- UnitOfMeasure --'
  - name: qualityIssueDescription
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An explanation of the type, nature, or origin of the identified quality issue.

      -- Description --

      The intent of this attribute is to fully inform data users of the scope and
      breadth of the quality issue so that informed decisions can be made to how the
      data is employed.

      -- UnitOfMeasure --'
- name: VoidCollectionArea
  physicalName: voidcollectionarea
  logicalType: object
  physicalType: table
  description: '-- Definition --

    A data collection region lacking suitable source coverage and/or where data is
    not required.

    -- Description --'
  customProperties:
  - property: sosiObjektType
    value: VoidCollectionArea
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: voidCollectionReason
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The reason(s) that geospatial data was not collected.

      -- Description --

      -- UnitOfMeasure --'
  - name: voidCollectionType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The type(s) of geospatial data that were not collected.

      -- Description --

      -- UnitOfMeasure --'
- name: GeneralLocation
  physicalName: generallocation
  logicalType: object
  physicalType: table
  description: '-- Definition --

    A location that normally does not appear as a specific, characterized object but
    that has either a name that is required to be displayed or other specific information
    associated with that location.

    -- Description --

    For example, the name of the Alps or the Sahara.'
  customProperties:
  - property: sosiObjektType
    value: GeneralLocation
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: namedLocationType
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The type of a location that normally does not appear as a specific, characterized
      object but that has a name that is required to be displayed in association with
      that location.

      -- Description --

      -- UnitOfMeasure --'
  - name: thematicClassification
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The classification of a feature among geographic themes.

      -- Description --

      -- UnitOfMeasure --'
  - name: informationReference
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      A reference to an external source or additional information.

      -- Description --

      For example a hyperlink.

      -- UnitOfMeasure --'
- name: OrganisationalUnit
  physicalName: organisationalunit
  logicalType: object
  physicalType: table
  description: '-- Definition --

    An actor established to manage the performance of activities to achieve one or
    more purposes of an organisation.

    -- Description --

    For example, a task unit or local office group.'
  customProperties:
  - property: sosiObjektType
    value: OrganisationalUnit
  - property: inheritsFrom
    value: ActorEntity
  properties:
  - name: contactInfo
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The telephone, postal, electronic and/or other contact information for a facility,
      organisation or person.

      -- Description --

      -- UnitOfMeasure --'
    required: true
