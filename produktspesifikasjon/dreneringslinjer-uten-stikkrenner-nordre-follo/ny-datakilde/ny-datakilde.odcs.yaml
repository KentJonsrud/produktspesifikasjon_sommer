apiVersion: v3.1.0
kind: DataContract
id: urn:odcs:dreneringslinjer-uten-stikkrenner-nordre-follo-ny-datakilde:1.0.0
version: 1.0.0
status: active
name: Dreneringslinjer uten stikkrenner Nordre Follo - Ny datakilde
schema:
- name: TunnelMouth
  physicalName: tunnelmouth
  logicalType: object
  physicalType: table
  description: '-- Definition --

    The opening of a tunnel into a larger space (for example: onto the terrain surface).

    -- Description --

    A tunnel is usually open to the terrain surface at both ends, but may sometimes
    lead to an enclosed space, for example: leading to an underground bunker, into
    an underground mine (termed an ''adit'') or into an underground railway station.'
  customProperties:
  - property: sosiObjektType
    value: TunnelMouth
  properties:
  - name: crossSectionalProfile
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The cross-sectional profile of an opening (for example: a tunnel or the space
      under a bridge span).

      -- Description --

      -- UnitOfMeasure --'
- name: TurnaroundSite
  physicalName: turnaroundsite
  logicalType: object
  physicalType: table
  description: '-- Definition --

    A shaped area at the terminus of a road that provides sufficient turning space
    allowing incoming traffic to turn around and exit without performing a stop-and-change-direction
    manoeuvre.

    -- Description --

    Construction is typically in the form of a defined shape (for example: circle,
    loop, or crescent). A median-like structure may exist in the center of the turnaround
    site, thus ensuring a well-defined pattern of vehicle movement. In residential
    areas the turnaround site often has multiple adjoining properties, each of which
    may have a separate driveway and/or defined parking area along the perimeter of
    the shaped area.'
  customProperties:
  - property: sosiObjektType
    value: TurnaroundSite
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: controllingAuthority
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The controlling authority responsible for a facility or site.

      -- Description --

      Controlling authorities may be distinguished by organizational level (for example:
      national, sub-national, or military district) and/or type (for example: private
      or public).

      -- UnitOfMeasure --'
  - name: controllingAuthorityIdent
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The recognized authority responsible for establishing and maintaining the administrative
      affairs of all matters relating to a particular field or subject.

      -- Description --

      -- UnitOfMeasure --'
  - name: generalPavementCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      A general description of the surface quality of a paved surface.

      -- Description --

      -- UnitOfMeasure --'
  - name: loadBearingSurfaceType
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The physical surface composition of a terrain surface that is intended to bear
      loads.

      -- Description --

      For example, the surface of a road, a runway, a hard standing, or a vehicle
      storage lot.

      -- UnitOfMeasure --'
  - name: maximumVehicleHeight
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The maximum height of a vehicle that can pass through the obstructing feature
      on a travelled way.

      -- Description --

      The height limitation assumes that the vehicle is less than 12 metres long and
      has a maximum rectangular width of 2.6 metres.

      -- UnitOfMeasure --'
  - name: maximumVehicleLength
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The maximum length of a vehicle that can pass through the obstructing feature
      on a travelled way.

      -- Description --

      The length limitation assumes that the vehicle has a maximum rectangular height
      of 4.3 metres and a maximum rectangular width of 2.6 metres.

      -- UnitOfMeasure --'
  - name: maximumVehicleWidth
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The maximum width of a vehicle that can pass through the obstructing feature
      on a travelled way.

      -- Description --

      The width limitation assumes that the vehicle is less than 12 metres long and
      has a maximum rectangular height of 4.3 metres.

      -- UnitOfMeasure --'
  - name: meansTransportation
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The intended method or means of moving from one place to another related to
      the feature or the feature''s intended use.

      -- Description --

      -- UnitOfMeasure --'
  - name: medianPresent
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that the lanes or tracks of a divided land transportation route
      (for example: a road or a railway) are separated by a vertical median barrier.

      -- Description --

      Often used to separate opposing flows of traffic in order to improve safety.
      For example, may be a substantial concrete barrier of approximately 1 metre
      height.

      -- UnitOfMeasure --'
  - name: permanent
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is permanent.

      -- Description --

      Temporary features last, or are meant to last, for a limited time only.

      -- UnitOfMeasure --'
  - name: physicalCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The physical condition of a man-made structure, as a whole, including the inside
      and/or outside of the structure and any contained and/or associated equipment.

      -- Description --

      The physical condition applies to any phase of the life cycle of a man-made
      structure from construction to destruction. Examples of man-made structures
      include roads, canals, buildings, towers, aerodromes and facilities.

      -- UnitOfMeasure --'
  - name: trafficRestrictionType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The reason for traffic restriction based on the nature of the route.

      -- Description --

      -- UnitOfMeasure --'
  - name: verticalRelativeLocation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The relationship between the feature and the underlying ground (terrain) or
      waterbody bottom.

      -- Description --

      -- UnitOfMeasure --'
  - name: waySurfaceCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      A categorisation based on the general pavement characteristic of the surface
      intending to sustain ground transport.

      -- Description --

      -- UnitOfMeasure --'
  - name: weatherRestrictionType
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The type of weather conditions under which a feature is usable.

      -- Description --

      -- UnitOfMeasure --'
  - name: weightBearingCapacity
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The maximum weight that can be supported by a surface.

      -- Description --

      -- UnitOfMeasure --'
- name: CausewayStructure
  physicalName: causewaystructure
  logicalType: object
  physicalType: table
  description: '-- Definition --

    A solid raised way across a terrain obstacle (for example: a wetland or a body
    of shallow water) that is intended to support a transportation route (for example:
    a road or a railway).

    -- Description --

    The causeway structure is often constructed from local fill supplemented by other
    materials (for example: rocks, boulders or gravel) and consists of a solid linear
    structure in the configuration of an embankment. Causeway structures are built
    just high enough to insure that the transportation route will remain passable
    during periods of flooding, tides and seasonal rainfall. Culverts may occur along
    the length of the causeway structure and individual sections of the causeway structure
    may be interrupted by bridges.'
  customProperties:
  - property: sosiObjektType
    value: CausewayStructure
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: conspicuousAirCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from the air.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: conspicuousGroundCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from on the ground.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: conspicuousSeaCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from the sea.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
      (for example: lighting). Factors affecting conspicuousness include size, shape,
      and/or height.

      -- UnitOfMeasure --'
  - name: controllingAuthority
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The controlling authority responsible for a facility or site.

      -- Description --

      Controlling authorities may be distinguished by organizational level (for example:
      national, sub-national, or military district) and/or type (for example: private
      or public).

      -- UnitOfMeasure --'
  - name: controllingAuthorityIdent
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The recognized authority responsible for establishing and maintaining the administrative
      affairs of all matters relating to a particular field or subject.

      -- Description --

      -- UnitOfMeasure --'
  - name: directivity
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The side(s) of a feature that produce the greatest visual significance and/or
      reflectivity potential.

      -- Description --

      -- UnitOfMeasure --'
  - name: facilityOperationalStatus
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The status of operation of a man-made structure, as a whole.

      -- Description --

      Includes actual operations, operational capability, and planned or proposed
      man-made structures.

      -- UnitOfMeasure --'
  - name: floodlit
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a structure is floodlit.

      -- Description --

      -- UnitOfMeasure --'
  - name: heightAboveSurfaceLevel
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical distance measured from the lowest point of the base of the feature
      at ground or water level (downhill/downstream side) to the tallest point of
      the feature.

      -- Description --

      For non-inland water bodies, the water level is usually understood to be Mean
      Sea Level (MSL). Note that the feature may be supported above the surface by
      another feature (for example: a tower supported by a building) and as a consequence
      the value of the Height Above Surface Level is different (larger) than the base-to-top
      height of the feature (for example: supported tower) itself.

      -- UnitOfMeasure --

      metre'
  - name: highestElevation
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The elevation from a specified vertical datum to the highest point on a feature.

      -- Description --

      In the case of multiple features that may be stacked on each other (for example:
      a railway on a bridge, a superstructure on a building, or an aerial on a tower)
      the highest elevation is that of the entire feature stack. For example, the
      highest elevation of a church is that of its steeple and not that of the roof
      of the church itself. The church itself may have a height above surface level
      that excludes the additional height of the steeple superstructure located on
      the church roof.

      -- UnitOfMeasure --

      metre'
  - name: maximumObstacleHeight
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The maximum distance from the bottom to the top of a terrain (or waterbody floor)
      obstacle.

      -- Description --

      May be a height or a depth.

      -- UnitOfMeasure --

      metre'
  - name: permanent
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      An indication that a feature is permanent.

      -- Description --

      Temporary features last, or are meant to last, for a limited time only.

      -- UnitOfMeasure --'
  - name: physicalCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The physical condition of a man-made structure, as a whole, including the inside
      and/or outside of the structure and any contained and/or associated equipment.

      -- Description --

      The physical condition applies to any phase of the life cycle of a man-made
      structure from construction to destruction. Examples of man-made structures
      include roads, canals, buildings, towers, aerodromes and facilities.

      -- UnitOfMeasure --'
  - name: predominantFeatureHeight
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The predominant height (the height of at least 50 percent) of the feature measured
      from the lowest point of the base at ground or water level (downhill side/downstream
      side).

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: structMatType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The primary type(s) of material composing a feature, exclusive of the surface.

      -- Description --

      The basis for ''primary'' may be, for example, compositional dominance or structural
      organization.

      -- UnitOfMeasure --'
  - name: surfaceSlope
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The slope (rate of upward inclination of the surface from the horizontal) of
      the surface of a feature (for example: the terrain or a waterbody floor).

      -- Description --

      The (percent) slope is determined as the change in height divided by the horizontal
      distance over which the change takes place, multiplied by one hundred: ((h2-h1)/d)*100.
      Generally the slope is determined along the primary alignment of a feature (its
      established direction of flow or use; for example: a road, a railway, a ridge
      line, and/or a bridge). In those cases where the primary alignment is essentially
      horizontal (for example, a beach, a watercourse bank, or a cut) the surface
      slope is typically determined at right angles to the primary alignment.

      -- UnitOfMeasure --

      percent'
  - name: waterLevelEffect
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The relationship between the feature and surrounding (including covering and/or
      underlying) water.

      -- Description --

      -- UnitOfMeasure --'
- name: BridgeSpan
  physicalName: bridgespan
  logicalType: object
  physicalType: table
  description: '-- Definition --

    A component of the deck of a bridge spanning successive bridge piers.

    -- Description --'
  customProperties:
  - property: sosiObjektType
    value: BridgeSpan
  - property: inheritsFrom
    value: FeatureEntity
  properties:
  - name: geometry
    logicalType: object
    physicalType: geometry(Geometry)
    required: true
    customProperties:
    - property: geometryType
      value: Geometry
  - name: angleOfIntendedPassage
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The angular distance in the horizontal plane measured from true north (0 degrees)
      clockwise to the path on the feature (0-180 degrees) where passage was intended.

      -- Description --

      The path of intended passage may go across or over the feature (ex. a bridge)
      or through it (ex. a tunnel).

      -- UnitOfMeasure --

      arcDegree'
  - name: horizontalClearanceOpen
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The horizontal clearance measured between two points for an opening span.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: structMatType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The primary type(s) of material composing a feature, exclusive of the surface.

      -- Description --

      The basis for ''primary'' may be, for example, compositional dominance or structural
      organization.

      -- UnitOfMeasure --'
  - name: verticalClearanceClosed
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical clearance of a feature in closed condition (for example: a closed
      lifting bridge) measured from the horizontal plane towards the feature overhead.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: verticalClearanceOpen
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The vertical clearance of a feature in opened condition (for example an open
      lifting bridge) measured from the horizontal plane towards the feature overhead.

      -- Description --

      -- UnitOfMeasure --

      metre'
  - name: bridgeOpeningType
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The type of structure or mechanism by which a bridge or bridge span is moved
      to allow passage of a vessel.

      -- Description --

      -- UnitOfMeasure --'
  - name: bridgeReferenceNumber
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The unique identifier of a bridge in accordance with the provisions of terrain
      analysis databases (for example: PTADB or TTADB).

      -- Description --

      The identifier is assigned consecutively (for example: within a map sheet or
      within a local area of interest) and begins with the northwest grid square of
      the UTM reference system and proceeds from left to right to the east edge of
      the sheet or area, continuing consecutively in the same way starting back at
      the west edge of the next line of UTM grid squares below those previously completed.
      The resulting identifiers are used to index an associated Bridge Information
      Table.

      -- UnitOfMeasure --'
  - name: bridgeStructureType
    logicalType: array
    items:
      logicalType: object
      properties:
      - name: valueOrReason
        logicalType: string
        required: true
    description: '-- Definition --

      The type(s) of structural design of a bridge, bridge span, or bridge superstructure.

      -- Description --

      -- UnitOfMeasure --'
  - name: bypassCondition
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The ease or ability to circumvent a destroyed section of bridge, tunnel or pass
      within a distance of two kilometres from the feature.

      -- Description --

      Bypass condition will not consider other bridges in bypass determination.

      -- UnitOfMeasure --'
  - name: conspicuousAirCategory
    logicalType: object
    properties:
    - name: valueOrReason
      logicalType: string
      required: true
    description: '-- Definition --

      The manner in which an object is conspicuous when viewed from the air.

      -- Description --

      A conspicuous feature is easily detected and identified under varying conditions
